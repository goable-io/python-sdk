name: Release

on:
  push:
    branches: [main]
    # Only cut a release when something that affects the PUBLISHED package
    # actually changes. `openapi.json` alone (formatting-only sync) doesn't
    # trigger a release -- the generated `_models.py` under `src` is what
    # ships, and that's covered by the `src/**` filter below. Merges that
    # touch only workflows, tests, or docs (README/CHANGELOG) don't trigger
    # a spurious release either. To force a release without a code change,
    # bump the version in `pyproject.toml`.
    paths:
      - "src/**"
      - "pyproject.toml"
  # Manual trigger for the first publish (and any out-of-band release): the
  # push filter above never fires on the repo's initial commit, and there is
  # no other way to kick a release without a code change.
  workflow_dispatch: {}

# Trusted Publishing (OIDC) needs id-token: write; tagging/release needs
# contents: write. No PyPI token secret is used or required.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ".[dev]" build

      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src
      - run: pytest

      # Version resolution policy (mirrors the TS SDK's release.yml):
      #   - pyproject.toml > PyPI latest  → publish pyproject.toml's version exactly
      #     (manual major/minor bump path).
      #   - pyproject.toml == PyPI latest → auto-bump the patch component
      #     (routine merge path).
      #   - pyproject.toml < PyPI latest  → fail loudly (someone forgot to bump).
      - name: Resolve next version
        id: bump
        run: |
          set -euo pipefail
          PKG_NAME="goable-sdk"
          REPO_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # `pip index versions` is experimental and emits a deprecation notice;
          # take ONLY the "<pkg> (x.y.z)" line and strip every whitespace char so
          # no stray newline/CR can reach the version parser (a trailing newline
          # here previously broke the interpolated Python string literal below).
          PYPI_LATEST=$(python -m pip index versions "$PKG_NAME" 2>/dev/null \
            | sed -nE 's/.*\(([0-9]+\.[0-9]+\.[0-9]+)\).*/\1/p' | head -1 || true)
          PYPI_LATEST=$(printf '%s' "${PYPI_LATEST:-}" | tr -d '[:space:]')
          if [ -z "$PYPI_LATEST" ]; then PYPI_LATEST="0.0.0"; fi

          # Compare via env vars (NEVER interpolate a captured value into Python
          # source — that is exactly what broke on the newline). Single-quoted
          # one-liners so the shell performs no substitution inside the source.
          CMP=$(REPO_VERSION="$REPO_VERSION" PYPI_LATEST="$PYPI_LATEST" python -c 'import os; from packaging.version import Version as V; a=V(os.environ["REPO_VERSION"]); b=V(os.environ["PYPI_LATEST"]); print("gt" if a>b else "eq" if a==b else "lt")')

          echo "pyproject.toml: $REPO_VERSION"
          echo "PyPI latest:    $PYPI_LATEST"
          echo "comparison:     $CMP"

          case "$CMP" in
            gt)
              NEXT="$REPO_VERSION"
              echo "Using pyproject.toml version (manual bump): $NEXT"
              ;;
            eq)
              NEXT=$(PYPI_LATEST="$PYPI_LATEST" python -c 'import os; from packaging.version import Version as V; v=V(os.environ["PYPI_LATEST"]); print(f"{v.major}.{v.minor}.{v.micro + 1}")')
              echo "Auto-bumping patch: $NEXT"
              sed -i "s/^version = \".*\"/version = \"$NEXT\"/" pyproject.toml
              ;;
            lt)
              echo "::error::pyproject.toml ($REPO_VERSION) is BEHIND PyPI latest ($PYPI_LATEST). Manual intervention required." >&2
              exit 1
              ;;
          esac

          echo "version=v${NEXT}" >> "$GITHUB_OUTPUT"
          echo "version_plain=${NEXT}" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

      # Tag-only push (no commit back to main). pyproject.toml on main stays
      # at its declared version; consumers read the real version from PyPI.
      - name: Create and push tag
        env:
          TAG: ${{ steps.bump.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          generate_release_notes: true
